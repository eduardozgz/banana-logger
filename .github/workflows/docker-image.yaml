name: Docker Image CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]

jobs:
  prepare-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/eduardozgz/banana-logger-ci:build-cache
          cache-to: type=registry,ref=ghcr.io/eduardozgz/banana-logger-ci:build-cache,mode=max
          tags: |
            ghcr.io/eduardozgz/banana-logger-ci:latest

  check:
    runs-on: ubuntu-latest
    needs: prepare-ci
    strategy:
      # Keep the other checks running when one fails, like the previous
      # independent jobs did.
      fail-fast: false
      matrix:
        script: [typecheck, lint, format, test]
    steps:
      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.script }}
        run: docker run ghcr.io/eduardozgz/banana-logger-ci:latest pnpm run ${{ matrix.script }}

  build:
    runs-on: ubuntu-latest
    # A matrix `needs` waits for every leg, so all four checks gate the builds.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: banana-logger-bot
            dockerfile: apps/bot/Dockerfile
          - image: banana-logger-db-utils
            dockerfile: packages/db/Dockerfile
          - image: banana-logger-backend
            dockerfile: apps/backend/Dockerfile
          - image: banana-logger-rest-proxy
            dockerfile: apps/rest-proxy/Dockerfile
          - image: banana-logger-frontend
            dockerfile: apps/frontend/Dockerfile
            # VITE_* values are inlined into the static build. Configure these as
            # repository variables (Settings → Secrets and variables → Actions →
            # Variables); VITE_DISCORD_CLIENT_ID is required for the invite links.
            build_args: |
              VITE_DISCORD_CLIENT_ID=${{ vars.VITE_DISCORD_CLIENT_ID }}
              VITE_SUPPORT_URL=${{ vars.VITE_SUPPORT_URL }}
              VITE_BOT_REPO_URL=${{ vars.VITE_BOT_REPO_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          cache-from: type=registry,ref=ghcr.io/eduardozgz/${{ matrix.image }}:build-cache
          cache-to: type=registry,ref=ghcr.io/eduardozgz/${{ matrix.image }}:build-cache,mode=max
          tags: |
            ghcr.io/eduardozgz/${{ matrix.image }}:latest
