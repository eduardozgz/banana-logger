services:
  bot:
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/storage/banana-logger.db}
    container_name: banana-logger-bot
    image: ghcr.io/eduardozgz/banana-logger-bot:latest
    restart: always
    depends_on:
      rest-proxy:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
    networks:
      - banana-logger

  rest-proxy:
    env_file: .env
    container_name: banana-logger-rest-proxy
    image: ghcr.io/eduardozgz/banana-logger-rest-proxy:latest
    restart: always
    networks:
      - banana-logger

  frontend:
    env_file: .env
    container_name: banana-logger-frontend
    image: ghcr.io/eduardozgz/banana-logger-frontend:latest
    ports:
      - "3000:80"
    restart: always
    networks:
      - banana-logger

  backend:
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/storage/banana-logger.db}
      BACKEND_PORT: 3000
    container_name: banana-logger-backend
    image: ghcr.io/eduardozgz/banana-logger-backend:latest
    ports:
      - "3001:3000"
    restart: always
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
    networks:
      - banana-logger

  # Applies pending migrations to the shared SQLite file, then exits. The bot and
  # backend wait for it to complete before starting.
  db-migrate:
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/storage/banana-logger.db}
    container_name: banana-logger-db-migrate
    image: ghcr.io/eduardozgz/banana-logger-db-utils:latest
    # Run the migrator directly: env is injected by compose, so skip the
    # `with-env` wrapper (which expects a ../../.env file that isn't in the image).
    command: ["pnpm", "-F", "@bl/db", "exec", "tsx", "src/migrate.ts"]
    restart: "no"
    volumes:
      - storage:/app/storage
    networks:
      - banana-logger

  redis:
    image: redis:8
    command: redis-server
    container_name: Redis
    restart: unless-stopped
    networks:
      - banana-logger
    ports:
      - "6379:6379"

# Named volume for the SQLite database. A named volume (rather than a bind mount)
# inherits the image's uid-1001 ownership on first use, so the non-root
# containers can write it without a host-side chown.
volumes:
  storage:

networks:
  banana-logger:
