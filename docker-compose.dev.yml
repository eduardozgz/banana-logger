services:
  # Dev uses a local SQLite file (DATABASE_URL=file:./storage/...), so there is
  # no database service here — just Redis.
  redis:
    image: redis
    command: redis-server
    container_name: Redis
    restart: unless-stopped
    networks:
      - banana-logger-dev
    ports:
      - "6379:6379"

  redis-insight:
    container_name: Redis-Insight
    image: redis/redisinsight:latest
    depends_on:
      - redis
    healthcheck:
      test: wget -qO- http://redis-insight:5540/api/health | grep up
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    ports:
      - "3003:5540"
    restart: unless-stopped
    networks:
      - banana-logger-dev

  setup-redis-insight:
    container_name: Setup-Redis-Insight
    image: curlimages/curl
    depends_on:
      redis-insight:
        condition: service_healthy
        restart: true
    command: |
      curl
        --connect-timeout 5 --max-time 10 --retry 10 --retry-delay 2 --retry-max-time 40 --retry-connrefused
        --location --request POST 'http://redis-insight:5540/api/databases/'
        --header 'Content-Type: application/json'
        --data-raw '{
            "name": "Local",
            "host": "redis",
            "port": 6379,
            "compressor": "NONE",
            "db": 0,
            "timeout": 30000
        }'
    networks:
      - banana-logger-dev

networks:
  banana-logger-dev:
